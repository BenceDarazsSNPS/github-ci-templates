name: Reusable Python Semantic Release

on:
  workflow_call:
    inputs:
      force:
        description: "Force a specific version bump instead of using conventional commits (auto, patch, minor, major, prerelease, or empty)"
        required: false
        type: string
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: ${{ inputs.force }}
