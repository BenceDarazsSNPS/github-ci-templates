name: Reusable Python Semantic Release

on:
  workflow_call:
    inputs:
      force:
        description: "Force a specific version bump instead of using conventional commits (auto, patch, minor, major, prerelease, or empty)"
        required: false
        type: string
        default: ""
      python-semantic-release-version:
        description: "Version of the python-semantic-release/python-semantic-release action to use"
        required: false
        type: string
        default: "v10.6.1"
      checkout-version:
        description: "Version of the actions/checkout action to use"
        required: false
        type: string
        default: "v7"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@${{ inputs.checkout-version }}
        with:
          fetch-depth: 0

      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@${{ inputs.python-semantic-release-version }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: ${{ inputs.force }}
