name: Reusable uv git-source sync

# Keeps every `[tool.uv.sources]` entry that pins a git tag on the newest
# semver tag its upstream repo has published, then opens (or updates) a single
# PR with the pyproject.toml + uv.lock change.
#
# This is the push-based half of the internal dependency chain: the upstream
# repo's release workflow dispatches `upstream-release` here the moment it tags,
# so the PR appears in seconds. The `schedule` trigger in the calling workflow
# is only a safety net for a dispatch that never arrived.

on:
  workflow_call:
    inputs:
      test-command:
        description: "Command that must pass before the PR is opened. Empty to skip testing."
        required: false
        type: string
        default: "uv run pytest"
      sync-command:
        description: "Command used to install the project before running tests."
        required: false
        type: string
        default: "uv sync --group dev"
      merge:
        description: >-
          Squash-merge the PR automatically once the tests pass. Use true for
          intermediate repos in the chain, false for the leaf repo you want to
          review by hand.
        required: false
        type: boolean
        default: false
      branch:
        description: "Branch the sync commit is force-pushed to."
        required: false
        type: string
        default: "deps/uv-sources-sync"
    secrets:
      DEPS_PAT:
        description: >-
          Token with contents:write and pull-requests:write on this repo, and
          contents:read on every private repo referenced from tool.uv.sources.
          It has to be a PAT rather than GITHUB_TOKEN: pushes made with
          GITHUB_TOKEN do not start further workflow runs, which would stall
          the release that this PR is supposed to produce.
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      # Two upstream releases landing at once must not race each other onto the
      # same branch. Never cancel: each run rebuilds the branch from the current
      # default branch, so the last one to finish is the complete answer.
      group: sync-uv-git-sources-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check the token is present
        # actions/checkout silently falls back to GITHUB_TOKEN when handed an
        # empty one, which would only surface much later as an unclonable
        # private dependency. Fail here, where the message is useful.
        env:
          DEPS_PAT: ${{ secrets.DEPS_PAT }}
        run: |
          if [ -z "${DEPS_PAT:-}" ]; then
            echo "::error::The DEPS_PAT secret is empty in ${GITHUB_REPOSITORY}. Add a PAT with contents:write and pull-requests:write on this repo and contents:read on its private tool.uv.sources dependencies: gh secret set DEPS_PAT -R ${GITHUB_REPOSITORY}"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPS_PAT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Authenticate git for private sources
        # Both `git ls-remote` below and uv's own clone during `uv lock` need
        # read access to the private dependency repos.
        run: git config --global url."https://x-access-token:${{ secrets.DEPS_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Point every git source at its newest tag
        id: bump
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          PYPROJECT = "pyproject.toml"
          SECTION = re.compile(r"^\s*\[(?P<name>[^\]]+)\]\s*$")
          ENTRY = re.compile(r"^(?P<name>[A-Za-z0-9._-]+)\s*=\s*\{(?P<body>.*)\}\s*$")
          GIT = re.compile(r'\bgit\s*=\s*"(?P<url>[^"]+)"')
          TAG = re.compile(r'\btag\s*=\s*"(?P<tag>[^"]+)"')
          SEMVER = re.compile(r"^v?(\d+)\.(\d+)\.(\d+)$")


          def latest_tag(url):
              """Highest semver tag on the remote, or None if it has none."""
              out = subprocess.run(
                  ["git", "ls-remote", "--tags", "--refs", url],
                  capture_output=True, text=True, check=True,
              ).stdout
              best = None
              for line in out.splitlines():
                  name = line.split("refs/tags/", 1)[-1].strip()
                  m = SEMVER.match(name)
                  if not m:
                      continue  # ignore prereleases and non-semver tags
                  key = tuple(int(p) for p in m.groups())
                  if best is None or key > best[0]:
                      best = (key, name)
              return best[1] if best else None


          lines = open(PYPROJECT, encoding="utf-8").read().splitlines(keepends=True)
          section = None
          changes = []

          for i, line in enumerate(lines):
              header = SECTION.match(line)
              if header:
                  section = header.group("name")
                  continue
              if section != "tool.uv.sources":
                  continue

              entry = ENTRY.match(line.strip())
              if not entry:
                  continue
              git = GIT.search(entry.group("body"))
              tag = TAG.search(entry.group("body"))
              if not git or not tag:
                  # A branch/rev pin, or a non-git source: not ours to manage.
                  continue

              name, url, current = entry.group("name"), git.group("url"), tag.group("tag")
              newest = latest_tag(url)
              if newest is None:
                  print(f"::warning::{name}: {url} has no semver tags, skipping")
                  continue
              if newest == current:
                  print(f"{name}: already on {current}")
                  continue

              print(f"{name}: {current} -> {newest}")
              lines[i] = line.replace(f'tag = "{current}"', f'tag = "{newest}"')
              changes.append((name, current, newest))

          if changes:
              open(PYPROJECT, "w", encoding="utf-8").writelines(lines)

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write(f"changed={'true' if changes else 'false'}\n")

          if changes:
              subject = (
                  f"chore(deps): update {changes[0][0]} to {changes[0][2]}"
                  if len(changes) == 1
                  else f"chore(deps): update {len(changes)} internal dependencies"
              )
              body = "\n".join(f"- `{n}`: `{old}` -> `{new}`" for n, old, new in changes)
              rationale = (
                  "Opened by the `sync-uv-git-sources` workflow after an upstream "
                  "release. The branch is rebuilt from the default branch on every "
                  "run, so it always reflects the newest tag of every source.\n"
              )
              with open("/tmp/pr-subject.txt", "w", encoding="utf-8") as fh:
                  fh.write(subject)
              with open("/tmp/pr-body.md", "w", encoding="utf-8") as fh:
                  fh.write(f"{body}\n\n{rationale}")
              # Written here rather than assembled in the shell: the body is full
              # of backticks, which a heredoc would try to run as commands.
              with open("/tmp/commit-msg.txt", "w", encoding="utf-8") as fh:
                  fh.write(f"{subject}\n\n{body}\n")
          PY

      - name: Relock
        if: steps.bump.outputs.changed == 'true'
        run: uv lock

      - name: Install
        if: steps.bump.outputs.changed == 'true' && inputs.sync-command != ''
        run: ${{ inputs.sync-command }}

      - name: Test against the new versions
        if: steps.bump.outputs.changed == 'true' && inputs.test-command != ''
        run: ${{ inputs.test-command }}

      - name: Push the branch
        if: steps.bump.outputs.changed == 'true'
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add pyproject.toml
          if [ -f uv.lock ]; then git add uv.lock; fi
          git commit --file /tmp/commit-msg.txt
          # Always force: the branch is a rebuild of the default branch, never
          # something a human has committed to.
          git push --force origin "$BRANCH"

      - name: Open or update the PR
        if: steps.bump.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.DEPS_PAT }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          subject=$(cat /tmp/pr-subject.txt)
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create --head "$BRANCH" --base "${GITHUB_REF_NAME}" \
              --title "$subject" --body-file /tmp/pr-body.md
            number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          else
            gh pr edit "$number" --title "$subject" --body-file /tmp/pr-body.md
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Merge
        if: steps.bump.outputs.changed == 'true' && inputs.merge
        env:
          GH_TOKEN: ${{ secrets.DEPS_PAT }}
        run: |
          set -euo pipefail
          # The tests above already gated this, so merge outright rather than
          # relying on --auto, which needs branch protection to be meaningful.
          gh pr merge "${{ steps.pr.outputs.number }}" --squash --delete-branch \
            --subject "$(cat /tmp/pr-subject.txt)" --body-file /tmp/pr-body.md
